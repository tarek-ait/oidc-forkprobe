name: oidc-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: report-reachability-only
        env:
          ID_TOKEN_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC_REQUEST_URL_SET=false"
            exit 0
          fi
          echo "OIDC_REQUEST_URL_SET=true"
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=example")
          echo "OIDC_HTTP_STATUS=$status"
          if [ "$status" = "200" ]; then echo "OIDC_REACHABLE=true"; else echo "OIDC_REACHABLE=false"; fi
